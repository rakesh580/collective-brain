name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch on new pushes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Backend ─────────────────────────────────────────────────────────────────

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.15.11
      - name: Run ruff check
        run: ruff check backend/
      - name: Run ruff format check
        run: ruff format --check backend/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: collective_brain_test
          POSTGRES_USER: cb_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cb_test -d collective_brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      # Both pooler and direct point to the same CI postgres (no pooler in CI)
      CB_DATABASE_URL: postgresql://cb_test:ci_test_password@localhost:5432/collective_brain_test
      CB_MIGRATION_DATABASE_URL: postgresql://cb_test:ci_test_password@localhost:5432/collective_brain_test
      CB_REDIS_URL: redis://localhost:6379/0
      CB_JWT_SECRET: ci-test-secret-minimum-32-chars-long
      CB_LLM_PROVIDER: ollama
      CB_DEV_MODE: "0"
      CB_LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          # Install CPU-only torch first (prevents pulling ~2 GB GPU build)
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U cb_test -d collective_brain_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run unit tests
        working-directory: backend
        run: |
          pytest tests/unit/ -v --tb=short --timeout=60 \
            --cov=app --cov-report=xml --cov-fail-under=10

      - name: Run integration tests
        working-directory: backend
        run: |
          pytest tests/integration/ -v --tb=short --timeout=120 \
            --cov=app --cov-append --cov-report=xml --cov-fail-under=10

      - name: Run security tests
        working-directory: backend
        run: |
          pytest tests/security/ -v --tb=short --timeout=60 \
            --cov=app --cov-append --cov-report=xml --cov-fail-under=10

      - name: Verify Decision Intelligence endpoints
        working-directory: backend
        run: |
          # Start server in background
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!

          # Wait for server to be ready (up to 30s)
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null 2>&1; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Register test user and get token
          TOKEN=$(curl -sf http://127.0.0.1:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke","email":"ci@test.com","password":"StrongP@ss1"}' \
            | python -c "import sys,json; print(json.load(sys.stdin).get('token',''))" 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            TOKEN=$(curl -sf http://127.0.0.1:8000/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"ci_smoke","password":"StrongP@ss1"}' \
              | python -c "import sys,json; print(json.load(sys.stdin).get('token',''))")
          fi

          FAILED=0
          for ENDPOINT in \
            "GET /api/v1/decisions" \
            "GET /api/v1/risk-radar/summary" \
            "GET /api/v1/continuity/dashboard" \
            "GET /api/v1/decisions/graph/data" \
            "GET /api/v1/decision-recommender/influence-map" \
            "GET /api/v1/notifications/webhooks" \
            "GET /api/v1/insights/latest-digest"; do
            METHOD=$(echo "$ENDPOINT" | cut -d' ' -f1)
            PATH_URL=$(echo "$ENDPOINT" | cut -d' ' -f2)
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X "$METHOD" \
              "http://127.0.0.1:8000${PATH_URL}" \
              -H "Authorization: Bearer $TOKEN")
            if [ "$STATUS" = "200" ]; then
              echo "OK: $ENDPOINT -> $STATUS"
            else
              echo "FAIL: $ENDPOINT -> $STATUS"
              FAILED=$((FAILED + 1))
            fi
          done

          kill $SERVER_PID 2>/dev/null || true

          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED endpoint(s) failed smoke test"
            exit 1
          fi
          echo "All Decision Intelligence endpoints passed smoke test"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  # ── Frontend ────────────────────────────────────────────────────────────────

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run tests
        working-directory: frontend
        run: npx vitest run --reporter=verbose
      - name: Verify test count
        working-directory: frontend
        run: |
          COUNT=$(npx vitest run 2>&1 | grep -oP '\d+ passed' | grep -oP '\d+')
          echo "Frontend tests passed: $COUNT"
          if [ "$COUNT" -lt 80 ]; then
            echo "Expected at least 80 frontend tests, got $COUNT"
            exit 1
          fi

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ── Docker ──────────────────────────────────────────────────────────────────

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, frontend-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security Audit ──────────────────────────────────────────────────────────

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Frontend npm audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      - name: Backend pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict || true
