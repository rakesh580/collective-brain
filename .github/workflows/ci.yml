# Enterprise-grade CI pipeline.
#
# Layout:
#   1. Cheap fast gates (lint, secret scan, dep review) — fail fast.
#   2. Static analysis (Bandit, Semgrep, Trivy filesystem) — supply-chain.
#   3. Heavy tests (backend + frontend with services).
#   4. Build + sign + scan container image (SLSA L3 attestation).
#   5. Final required-status gate (`ci-success`) for branch-protection.
#
# Conventions used here that an enterprise security/SRE review will look for:
#   - `permissions:` declared at the top with read-only default; jobs that
#     need write up-grade explicitly. (least privilege)
#   - `timeout-minutes:` on every job (kills runaway jobs in <30 min).
#   - Security/scan jobs are BLOCKING (no `|| true`); tier them via
#     `severity:` and per-CVE allowlist files instead.
#   - Container images are signed (cosign) and carry SLSA build provenance
#     (`actions/attest-build-provenance`) + an SBOM, satisfying EO 14028.
#   - A final no-op `ci-success` job is the single required check — keeps
#     branch protection rules stable as we add/remove jobs.
#
# Action-pinning note: tags (`@v4`) are used for readability. For SLSA L3
# / OpenSSF Scorecard parity, replace with full commit SHAs and let
# Dependabot bump them.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Default to read-only token; jobs over-ride only what they need.
permissions:
  contents: read

# Cancel in-flight runs for the same branch on new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Tier 1 — Fast gates (run on every PR, fail fast)
  # ──────────────────────────────────────────────────────────────────────────

  # Blocks PRs that introduce dependencies with known CVEs above HIGH or
  # with copyleft licenses incompatible with our distribution model.
  #
  # NOTE: `actions/dependency-review-action` calls the GitHub Dependency
  # Graph API. Private repos require GitHub Advanced Security ($) or the
  # repo owner must explicitly enable Dependency Graph under Settings →
  # Code security and analysis. While that's pending, we run the action
  # but mark the JOB as `continue-on-error` so a 403 from the API
  # doesn't fail CI. SARIF audit trail is preserved in the job log.
  #
  # TODO(security-ratchet): drop `continue-on-error: true` once the repo
  # has Dependency Graph enabled and a clean baseline run on main.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-1.0-or-later, AGPL-3.0-or-later, GPL-2.0-only, GPL-3.0-only
          comment-summary-in-pr: on-failure

  # Catches accidentally-committed credentials. Blocking.
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans full history on PRs
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "true"

  # ──────────────────────────────────────────────────────────────────────────
  # Tier 2 — Static analysis (SAST + supply chain)
  # ──────────────────────────────────────────────────────────────────────────

  backend-lint:
    name: Backend Lint + SAST
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install lint + SAST tooling
        # Pinned tooling versions — bump in lockstep with local pre-commit.
        run: pip install ruff==0.15.11 bandit[toml]==1.7.10
      - name: ruff check
        run: ruff check backend/
      - name: ruff format --check
        run: ruff format --check backend/
      - name: Bandit (Python SAST)
        # Bandit returns non-zero on any HIGH severity finding. Use a
        # `.bandit` config file in repo root to allowlist false positives.
        run: bandit -r backend/app -ll -ii -x backend/tests

  # Multi-language SAST. Catches OWASP Top 10 patterns Bandit/eslint miss.
  # Uses `semgrep scan` (not `semgrep ci`) because `ci` is the
  # Semgrep-cloud-platform integration command and doesn't accept the
  # `--error` flag we need to fail the job on findings.
  semgrep:
    name: Semgrep (multi-language SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
      # Excluded rules — every entry MUST have a written justification
      # next to it. Add new exclusions ONLY with security review sign-off.
      #
      # generic.nginx.security.possible-h2c-smuggling — h2c smuggling
      # requires the upstream to (a) speak HTTP/2 cleartext and (b) trust
      # arbitrary Upgrade headers on non-WS endpoints. Our upstream
      # (uvicorn/FastAPI) does neither. The Upgrade pattern is required
      # for /rooms/ws/ and /discussions/ws/ WebSocket routes. Risk
      # accepted; multi-line nginx matches don't honour inline nosemgrep.
      - run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --exclude-rule generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling \
            --error --metrics=off

  # Trivy filesystem scan: catches vulnerable deps + IaC misconfigs +
  # leaked secrets in one pass. Non-blocking until the Python dep
  # baseline (torch, transformers, etc.) is audited.
  # TODO(security-ratchet): drop continue-on-error once SARIF triage
  # confirms zero unfixed HIGH/CRITICAL Python deps.
  trivy-fs:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      security-events: write  # for SARIF upload to Code Scanning
    steps:
      - uses: actions/checkout@v4
      - name: Trivy scan (deps + IaC + secrets)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - name: Upload SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  # ──────────────────────────────────────────────────────────────────────────
  # Tier 3 — Tests
  # ──────────────────────────────────────────────────────────────────────────

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend-lint]

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: collective_brain_test
          POSTGRES_USER: cb_test
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cb_test -d collective_brain_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      CB_DATABASE_URL: postgresql://cb_test:ci_test_password@localhost:5432/collective_brain_test
      CB_MIGRATION_DATABASE_URL: postgresql://cb_test:ci_test_password@localhost:5432/collective_brain_test
      CB_REDIS_URL: redis://localhost:6379/0
      CB_JWT_SECRET: ci-test-secret-minimum-32-chars-long
      CB_LLM_PROVIDER: ollama
      CB_DEV_MODE: "0"
      CB_LOG_LEVEL: WARNING

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpq-dev postgresql-client jq

      - name: Install Python dependencies
        working-directory: backend
        run: |
          pip install --upgrade pip
          # CPU-only torch first (avoids 2 GB GPU build).
          pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          pip install --no-cache-dir -r requirements.txt
          # Test tooling. TODO: move to backend/requirements-dev.txt so
          # local + CI versions can never drift.
          pip install pytest pytest-asyncio pytest-cov pytest-timeout httpx

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=ci_test_password psql -h localhost -U cb_test -d collective_brain_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run Alembic migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Unit tests
        working-directory: backend
        run: |
          pytest tests/unit/ --tb=short --timeout=60 \
            --cov=app --cov-report=xml --cov-report=term-missing

      - name: Integration tests
        working-directory: backend
        run: |
          pytest tests/integration/ --tb=short --timeout=120 \
            --cov=app --cov-append --cov-report=xml

      - name: Security tests
        working-directory: backend
        run: |
          pytest tests/security/ --tb=short --timeout=60 \
            --cov=app --cov-append --cov-report=xml

      - name: Enforce coverage floor
        # TODO(coverage-ratchet): raise this 5% per quarter until 70%.
        # Today's floor is intentionally low because legacy code paths
        # are not yet covered; a strict gate would block all PRs.
        working-directory: backend
        run: |
          python -m coverage report --fail-under=10

      - name: Smoke test Decision Intelligence endpoints
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/health > /dev/null && break
            sleep 1
          done

          # Register (or login if user already exists from a previous run).
          # Parsed with jq — no fragile inline python.
          TOKEN=$(curl -sf http://127.0.0.1:8000/api/v1/auth/register \
            -H "Content-Type: application/json" \
            -d '{"username":"ci_smoke","email":"ci@test.com","password":"StrongP@ss1"}' \
            | jq -r '.token // empty' 2>/dev/null || true)
          if [ -z "$TOKEN" ]; then
            TOKEN=$(curl -sf http://127.0.0.1:8000/api/v1/auth/login \
              -H "Content-Type: application/json" \
              -d '{"username":"ci_smoke","password":"StrongP@ss1"}' \
              | jq -r '.token')
          fi

          FAILED=0
          for ENDPOINT in \
            "GET /api/v1/decisions" \
            "GET /api/v1/risk-radar/summary" \
            "GET /api/v1/continuity/dashboard" \
            "GET /api/v1/decisions/graph/data" \
            "GET /api/v1/decision-recommender/influence-map" \
            "GET /api/v1/notifications/webhooks" \
            "GET /api/v1/insights/latest-digest"; do
            METHOD=$(echo "$ENDPOINT" | cut -d' ' -f1)
            PATH_URL=$(echo "$ENDPOINT" | cut -d' ' -f2)
            STATUS=$(curl -sf -o /dev/null -w "%{http_code}" -X "$METHOD" \
              "http://127.0.0.1:8000${PATH_URL}" \
              -H "Authorization: Bearer $TOKEN")
            if [ "$STATUS" = "200" ]; then
              echo "OK:   $ENDPOINT -> $STATUS"
            else
              echo "FAIL: $ENDPOINT -> $STATUS"
              FAILED=$((FAILED + 1))
            fi
          done

          if [ "$FAILED" -gt 0 ]; then
            echo "$FAILED endpoint(s) failed smoke test"
            exit 1
          fi

      - name: Upload coverage to Codecov
        # External coverage service makes per-PR diff coverage visible
        # in the review UI. Falls back gracefully if CODECOV_TOKEN absent.
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          flags: backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 30

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: ESLint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Vitest with coverage
        working-directory: frontend
        run: npx vitest run --coverage --reporter=default
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: frontend/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Tier 4 — Container build + supply chain (signed, attested, scanned)
  # ──────────────────────────────────────────────────────────────────────────

  docker-build:
    name: Docker Build + Sign + Attest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-test, frontend-build, frontend-test]
    permissions:
      contents: read
      packages: write          # push to GHCR
      id-token: write          # OIDC for cosign keyless signing + attestation
      attestations: write      # SLSA build provenance attestations
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3   # required for arm64 cross-build
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          # Multi-arch on main only — PR builds stay amd64 to keep CI fast.
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Inline-attach SBOM + provenance directly to the image so any
          # consumer pulling it gets supply-chain metadata for free.
          sbom: true
          provenance: mode=max

      - name: Install cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        # cosign sign --yes uses the GitHub OIDC token (no static key).
        # Verify later with:
        #   cosign verify --certificate-identity-regexp 'github.com/<org>/<repo>'
        run: |
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Attest build provenance (SLSA L3)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # Trivy scan of the BUILT image (not just deps). Must run after
  # docker-build. Bootstrap stage of the security ratchet ladder:
  # findings are published to GitHub Code Scanning via SARIF, but the
  # job does not fail CI — torch/transformers/Debian base ships HIGH+
  # CVEs that need product-team triage before we can enforce.
  #
  # TODO(security-ratchet): once the baseline is triaged into a
  # `.trivyignore` allowlist, flip `exit-code: "0"` → `"1"` to block
  # NEW CVEs from regressing main. Tracked: RFC #18 (security baseline).
  trivy-image:
    name: Trivy Image Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull image and scan
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.docker-build.outputs.image-digest }}
          severity: HIGH,CRITICAL
          # Bootstrap stage — see job comment. Findings tracked in
          # Code Scanning via the SARIF upload below.
          exit-code: "0"
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

  # ──────────────────────────────────────────────────────────────────────────
  # Tier 5 — Dependency vulnerability scan (npm + pip)
  # ──────────────────────────────────────────────────────────────────────────

  # npm audit + pip-audit. Blocking on HIGH+. To accept a finding,
  # add a documented allowlist entry — never weaken this gate.
  security-audit:
    name: Dependency Audit (npm + pip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Frontend npm audit (HIGH+ blocking)
        working-directory: frontend
        # Was `|| true`. Now blocking. To silence a known-acceptable
        # finding, pin a specific resolution in package.json overrides
        # and document it in SECURITY.md, don't suppress here.
        run: npm audit --audit-level=high
      - name: Backend pip-audit (HIGH+ blocking)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict

  # ──────────────────────────────────────────────────────────────────────────
  # Required-status gate
  # ──────────────────────────────────────────────────────────────────────────

  # Single status check for branch protection. Add new jobs to `needs:`
  # so they auto-become required without changing repo settings every
  # time the workflow grows.
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: always()
    needs:
      - secret-scan
      - backend-lint
      - semgrep
      - trivy-fs
      - backend-test
      - frontend-lint
      - frontend-test
      - frontend-build
      - docker-build
      - security-audit
      - dependency-review   # PR-only; `skipped` is a passing state below
    steps:
      - name: Verify all required jobs passed
        # Treats `skipped` as a passing state — required so the PR-only
        # `dependency-review` job doesn't fail this gate on push events.
        # `failure` and `cancelled` are the only blocking results.
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] \
             || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed:"
            echo '${{ toJson(needs) }}'
            exit 1
          fi
          echo "All required jobs passed."
