name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  # Also allow manual trigger with optional image override
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest sha)"
        required: false
        default: ""
      run_migrations:
        description: "Run Alembic migrations before deploying?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel an in-flight deploy

jobs:
  # ── Guard: only deploy when CI passed ──────────────────────────────────────
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI OK, deploying."

  # ── Migrate: run Alembic before new code goes live ─────────────────────────
  migrate:
    name: Run Migrations
    runs-on: ubuntu-latest
    needs: check-ci
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true' ||
      github.event_name == 'workflow_run'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends libpq-dev

      - name: Install Alembic + psycopg2
        working-directory: backend
        run: |
          pip install --upgrade pip
          pip install alembic psycopg2-binary sqlalchemy pgvector

      - name: Force IPv4 for Supabase connectivity
        run: |
          # GitHub Actions runners sometimes resolve Supabase to IPv6 which is unreachable
          sudo sh -c 'echo "precedence ::ffff:0:0/96 100" >> /etc/gai.conf'

      - name: Run Alembic migrations (dry-run check first)
        working-directory: backend
        env:
          CB_MIGRATION_DATABASE_URL: ${{ secrets.CB_MIGRATION_DATABASE_URL }}
          CB_DATABASE_URL: ${{ secrets.CB_DATABASE_URL }}
        run: |
          if [ -z "$CB_MIGRATION_DATABASE_URL" ] && [ -z "$CB_DATABASE_URL" ]; then
            echo "::warning::Neither CB_MIGRATION_DATABASE_URL nor CB_DATABASE_URL secrets are set."
            echo "Skipping migrations. Set secrets in GitHub repo → Settings → Environments → production."
            exit 0
          fi
          echo "Current revision:"
          python -m alembic current
          echo "Pending migrations:"
          python -m alembic history --indicate-current
          echo "Running upgrade..."
          python -m alembic upgrade head
          echo "Migration complete."

  # ── Deploy to Hugging Face Spaces ──────────────────────────────────────────
  deploy-hf-spaces:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git push

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret not set — skipping HF Spaces deployment."
            echo "To enable: go to huggingface.co/settings/tokens, create a token with 'write' scope,"
            echo "then run: gh secret set HF_TOKEN --env production --body 'hf_...'"
            exit 0
          fi
          if [ -z "$HF_SPACE_NAME" ]; then
            echo "::warning::HF_SPACE_NAME variable not set — skipping HF Spaces deployment."
            exit 0
          fi
          git remote add hf "https://HF_USER:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME}" 2>/dev/null || \
            git remote set-url hf "https://HF_USER:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME}"
          git push hf main --force
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE_NAME}"

  # ── Deploy backend ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: migrate
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/backend:$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Option A: deploy via SSH (self-hosted or VPS) ──────────────────────
      # Uncomment and fill in CB_DEPLOY_HOST / CB_DEPLOY_KEY secrets if using SSH.
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.CB_DEPLOY_HOST }}
      #     username: deploy
      #     key: ${{ secrets.CB_DEPLOY_KEY }}
      #     script: |
      #       docker pull ${{ steps.image.outputs.image }}
      #       docker stop collective-brain-backend || true
      #       docker rm   collective-brain-backend || true
      #       docker run -d \
      #         --name collective-brain-backend \
      #         --restart unless-stopped \
      #         -p 8000:8000 \
      #         -e CB_DATABASE_URL="${{ secrets.CB_DATABASE_URL }}" \
      #         -e CB_JWT_SECRET="${{ secrets.CB_JWT_SECRET }}" \
      #         -e CB_CLAUDE_API_KEY="${{ secrets.CB_CLAUDE_API_KEY }}" \
      #         -e CB_REDIS_URL="${{ secrets.CB_REDIS_URL }}" \
      #         -e CB_SUPABASE_URL="${{ secrets.CB_SUPABASE_URL }}" \
      #         -e CB_SUPABASE_SERVICE_KEY="${{ secrets.CB_SUPABASE_SERVICE_KEY }}" \
      #         -e CB_OTEL_ENDPOINT="${{ secrets.CB_OTEL_ENDPOINT }}" \
      #         -e CB_DEV_MODE=0 \
      #         ${{ steps.image.outputs.image }}

      # ── Option B: deploy to Railway ───────────────────────────────────────
      # Uncomment if using Railway. Set RAILWAY_TOKEN + RAILWAY_SERVICE secrets.
      #
      # - name: Install Railway CLI
      #   run: npm install -g @railway/cli
      # - name: Deploy to Railway
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #   run: railway up --service ${{ secrets.RAILWAY_SERVICE }} --detach

      - name: Deployment placeholder
        run: |
          echo "Image ready: ${{ steps.image.outputs.image }}"
          echo "Uncomment the SSH or Railway deploy block above to activate deployment."
          echo "Required secrets: CB_DEPLOY_HOST, CB_DEPLOY_KEY (SSH) or RAILWAY_TOKEN (Railway)"

  # ── Deploy frontend ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.CB_GOOGLE_CLIENT_ID }}
        run: npm run build

      # ── Option A: Vercel ──────────────────────────────────────────────────
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: frontend
      #     vercel-args: "--prod"

      # ── Option B: Netlify ─────────────────────────────────────────────────
      # - name: Deploy to Netlify
      #   uses: nwtgck/actions-netlify@v3
      #   with:
      #     publish-dir: frontend/dist
      #     production-deploy: true
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     deploy-message: "Deploy ${{ github.sha }}"
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deployment placeholder
        run: |
          echo "Frontend built. dist/ contains $(find frontend/dist -type f | wc -l) files."
          echo "Uncomment Vercel or Netlify block above to activate deployment."
