# ══════════════════════════════════════════════════════════════════════════════
# Deploy — Collective Brain
# ══════════════════════════════════════════════════════════════════════════════
#
# Required secrets & variables (set in GitHub repo → Settings → Secrets):
#
# ── HuggingFace Spaces ──────────────────────────────────────────────────────
#   HF_TOKEN              — HuggingFace API token with write access
#   HF_SPACE_NAME (var)   — Format: username/space-name
#
# ── Render.com (backup) ─────────────────────────────────────────────────────
#   RENDER_DEPLOY_HOOK_URL — Render deploy hook URL
#                            (Settings → Deploy Hook → copy URL)
#
# ── Common secrets (set in HF Space settings / Render env vars) ─────────────
#   CB_DATABASE_URL       — PostgreSQL connection string
#   CB_JWT_SECRET         — 32+ char secret for JWT signing
#   CB_CLAUDE_API_KEY     — Anthropic API key (optional, for Claude LLM)
#   CB_REDIS_URL          — Redis connection string (optional)
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  # Also allow manual trigger with optional image override
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: latest sha)"
        required: false
        default: ""
      run_migrations:
        description: "Run Alembic migrations before deploying?"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      deploy_render:
        description: "Also deploy to Render.com (backup)?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: deploy-production
  cancel-in-progress: false   # Never cancel an in-flight deploy

jobs:
  # ── Guard: only deploy when CI passed ──────────────────────────────────────
  check-ci:
    name: Check CI Status
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: CI passed — proceeding to deploy
        run: echo "CI OK, deploying."

  # ── Migrate ────────────────────────────────────────────────────────────────
  # Supabase Nano (free tier) only exposes IPv6 for direct DB connections.
  # GitHub Actions runners cannot route to IPv6 — so CI migrations always fail.
  #
  # Migrations run automatically at app startup via database.py:_run_alembic_migrations()
  # This is actually safer — migrations execute alongside the code that needs them.
  #
  # For manual migrations, use the separate "Database Migrations" workflow
  # (migrate.yml) which can be triggered manually with a confirmation prompt.
  migrate:
    name: Run Migrations (skipped — runs at app startup)
    runs-on: ubuntu-latest
    needs: check-ci
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.run_migrations == 'true'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Migration info
        run: |
          echo "Migrations run automatically when the app starts (database.py)."
          echo "For manual migration control, use the 'Database Migrations' workflow."
          echo "This step only runs on manual workflow_dispatch with run_migrations=true."

  # ── Deploy to Hugging Face Spaces ──────────────────────────────────────────
  deploy-hf-spaces:
    name: Deploy to HF Spaces
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for git push

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning::HF_TOKEN secret not set — skipping HF Spaces deployment."
            echo "To enable: go to huggingface.co/settings/tokens, create a token with 'write' scope,"
            echo "then run: gh secret set HF_TOKEN --env production --body 'hf_...'"
            exit 0
          fi
          if [ -z "$HF_SPACE_NAME" ]; then
            echo "::warning::HF_SPACE_NAME variable not set — skipping HF Spaces deployment."
            exit 0
          fi
          git remote add hf "https://HF_USER:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME}" 2>/dev/null || \
            git remote set-url hf "https://HF_USER:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE_NAME}"
          git push hf main --force
          echo "Deployed to https://huggingface.co/spaces/${HF_SPACE_NAME}"

      - name: Verify Dockerfile uses root multi-stage build
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Root Dockerfile not found! HF Spaces needs the multi-stage Dockerfile."
            exit 1
          fi
          echo "Root Dockerfile present — multi-stage build (frontend + backend) will be used by HF Spaces."

  # ── Post-deploy smoke test (HF Spaces) ────────────────────────────────────
  smoke-test-hf:
    name: Smoke Test (HF Spaces)
    runs-on: ubuntu-latest
    needs: deploy-hf-spaces
    if: >
      always() && needs.deploy-hf-spaces.result == 'success'
    steps:
      - name: Wait for app to boot
        run: |
          echo "Waiting 60 seconds for HF Spaces container to build and start..."
          sleep 60

      - name: Health check
        env:
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_SPACE_NAME" ]; then
            echo "::warning::HF_SPACE_NAME not set — skipping smoke test."
            exit 0
          fi

          # Derive the HF Spaces URL (username-spacename.hf.space)
          HF_URL="https://$(echo "$HF_SPACE_NAME" | tr '/' '-').hf.space"
          echo "Testing: $HF_URL"

          # Health endpoint
          echo "--- GET /api/v1/health ---"
          HTTP_CODE=$(curl -sf -o /tmp/health_response -w "%{http_code}" \
            --max-time 30 --retry 5 --retry-delay 15 \
            "${HF_URL}/api/v1/health" || echo "000")
          cat /tmp/health_response 2>/dev/null || true
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check PASSED (HTTP $HTTP_CODE)"
          else
            echo "::warning::Health check returned HTTP $HTTP_CODE (app may still be building)"
          fi

          # Auth endpoint (should return 401 or 422, not 500)
          echo "--- GET /api/v1/auth/me ---"
          AUTH_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 "${HF_URL}/api/v1/auth/me" || echo "000")
          if [ "$AUTH_CODE" = "401" ] || [ "$AUTH_CODE" = "403" ] || [ "$AUTH_CODE" = "422" ]; then
            echo "Auth endpoint OK (HTTP $AUTH_CODE — expected without token)"
          elif [ "$AUTH_CODE" = "500" ] || [ "$AUTH_CODE" = "000" ]; then
            echo "::warning::Auth endpoint returned HTTP $AUTH_CODE"
          else
            echo "Auth endpoint returned HTTP $AUTH_CODE"
          fi

          # Decisions endpoint (should return 401 or 403, not 500)
          echo "--- GET /api/v1/decisions ---"
          DECISIONS_CODE=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 "${HF_URL}/api/v1/decisions" || echo "000")
          if [ "$DECISIONS_CODE" = "401" ] || [ "$DECISIONS_CODE" = "403" ]; then
            echo "Decisions endpoint OK (HTTP $DECISIONS_CODE — expected without token)"
          elif [ "$DECISIONS_CODE" = "500" ] || [ "$DECISIONS_CODE" = "000" ]; then
            echo "::warning::Decisions endpoint returned HTTP $DECISIONS_CODE"
          else
            echo "Decisions endpoint returned HTTP $DECISIONS_CODE"
          fi

          echo ""
          echo "Smoke test complete."

  # ── Deploy to Render.com (backup) ──────────────────────────────────────────
  deploy-render:
    name: Deploy to Render (Backup)
    runs-on: ubuntu-latest
    needs: check-ci
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_render == 'true'
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret not set."
            echo "To set up: go to Render dashboard → your service → Settings → Deploy Hook,"
            echo "copy the URL, then run: gh secret set RENDER_DEPLOY_HOOK_URL --body 'https://...'"
            exit 1
          fi
          echo "Triggering Render.com deployment..."
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "201" ]; then
            echo "Render deploy hook triggered successfully (HTTP $HTTP_CODE)"
          else
            echo "::error::Render deploy hook failed with HTTP $HTTP_CODE"
            exit 1
          fi

  # ── Post-deploy smoke test (Render) ────────────────────────────────────────
  smoke-test-render:
    name: Smoke Test (Render)
    runs-on: ubuntu-latest
    needs: deploy-render
    if: >
      always() && needs.deploy-render.result == 'success'
    steps:
      - name: Wait for Render deploy
        run: |
          echo "Waiting 60 seconds for Render to pull and deploy..."
          sleep 60

      - name: Health check
        env:
          RENDER_APP_URL: ${{ vars.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "::warning::RENDER_APP_URL variable not set — skipping smoke test."
            echo "Set it to your Render service URL (e.g. https://collective-brain.onrender.com)"
            exit 0
          fi

          echo "Testing: $RENDER_APP_URL"

          # Health endpoint
          echo "--- GET /api/v1/health ---"
          HTTP_CODE=$(curl -sf -o /tmp/health_response -w "%{http_code}" \
            --max-time 30 --retry 5 --retry-delay 15 \
            "${RENDER_APP_URL}/api/v1/health" || echo "000")
          cat /tmp/health_response 2>/dev/null || true
          echo ""

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check PASSED (HTTP $HTTP_CODE)"
          else
            echo "::warning::Health check returned HTTP $HTTP_CODE"
          fi

  # ── Deploy backend ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${{ github.repository }}/backend:$TAG" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Option A: deploy via SSH (self-hosted or VPS) ──────────────────────
      # Uncomment and fill in CB_DEPLOY_HOST / CB_DEPLOY_KEY secrets if using SSH.
      #
      # - name: Deploy via SSH
      #   uses: appleboy/ssh-action@v1.0.3
      #   with:
      #     host: ${{ secrets.CB_DEPLOY_HOST }}
      #     username: deploy
      #     key: ${{ secrets.CB_DEPLOY_KEY }}
      #     script: |
      #       docker pull ${{ steps.image.outputs.image }}
      #       docker stop collective-brain-backend || true
      #       docker rm   collective-brain-backend || true
      #       docker run -d \
      #         --name collective-brain-backend \
      #         --restart unless-stopped \
      #         -p 8000:8000 \
      #         -e CB_DATABASE_URL="${{ secrets.CB_DATABASE_URL }}" \
      #         -e CB_JWT_SECRET="${{ secrets.CB_JWT_SECRET }}" \
      #         -e CB_CLAUDE_API_KEY="${{ secrets.CB_CLAUDE_API_KEY }}" \
      #         -e CB_REDIS_URL="${{ secrets.CB_REDIS_URL }}" \
      #         -e CB_SUPABASE_URL="${{ secrets.CB_SUPABASE_URL }}" \
      #         -e CB_SUPABASE_SERVICE_KEY="${{ secrets.CB_SUPABASE_SERVICE_KEY }}" \
      #         -e CB_OTEL_ENDPOINT="${{ secrets.CB_OTEL_ENDPOINT }}" \
      #         -e CB_DEV_MODE=0 \
      #         ${{ steps.image.outputs.image }}

      # ── Option B: deploy to Railway ───────────────────────────────────────
      # Uncomment if using Railway. Set RAILWAY_TOKEN + RAILWAY_SERVICE secrets.
      #
      # - name: Install Railway CLI
      #   run: npm install -g @railway/cli
      # - name: Deploy to Railway
      #   env:
      #     RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      #   run: railway up --service ${{ secrets.RAILWAY_SERVICE }} --detach

      - name: Deployment placeholder
        run: |
          echo "Image ready: ${{ steps.image.outputs.image }}"
          echo "Uncomment the SSH or Railway deploy block above to activate deployment."
          echo "Required secrets: CB_DEPLOY_HOST, CB_DEPLOY_KEY (SSH) or RAILWAY_TOKEN (Railway)"

  # ── Deploy frontend ────────────────────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: check-ci
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build for production
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.CB_GOOGLE_CLIENT_ID }}
        run: npm run build

      # ── Option A: Vercel ──────────────────────────────────────────────────
      # - name: Deploy to Vercel
      #   uses: amondnet/vercel-action@v25
      #   with:
      #     vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #     vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #     vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #     working-directory: frontend
      #     vercel-args: "--prod"

      # ── Option B: Netlify ─────────────────────────────────────────────────
      # - name: Deploy to Netlify
      #   uses: nwtgck/actions-netlify@v3
      #   with:
      #     publish-dir: frontend/dist
      #     production-deploy: true
      #     github-token: ${{ secrets.GITHUB_TOKEN }}
      #     deploy-message: "Deploy ${{ github.sha }}"
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

      - name: Deployment placeholder
        run: |
          echo "Frontend built. dist/ contains $(find frontend/dist -type f | wc -l) files."
          echo "Uncomment Vercel or Netlify block above to activate deployment."
