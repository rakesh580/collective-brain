# ══════════════════════════════════════════════════════════════════════════════
# Deploy — Collective Brain (enterprise-grade)
# ══════════════════════════════════════════════════════════════════════════════
#
# Pipeline shape:
#   1. Gate          — CI must be green; deploy-freeze must not be active.
#   2. Verify image  — cosign keyless signature + SLSA provenance check.
#                      An unsigned or tampered image is REJECTED here.
#   3. Snapshot DB   — placeholder for a pre-deploy backup hook.
#   4. Migrate       — explicit, observable step (not a side-effect of boot).
#   5. Deploy        — HF Spaces (primary); Render and self-hosted optional.
#   6. Smoke test    — POLL until ready (no fixed sleep). FAIL hard on red.
#   7. Auto-rollback — on smoke failure, redeploy the previous good SHA.
#   8. Record + notify — create a GitHub Deployment, post DORA metrics,
#                         notify Slack. ALL deploys are observable.
#
# Required secrets / variables (Settings → Secrets and variables → Actions):
#
#   ── HF Spaces ──
#   HF_TOKEN              (secret) — HuggingFace token, write scope
#   HF_SPACE_NAME         (var)    — "username/space-name"
#
#   ── Render (optional) ──
#   RENDER_DEPLOY_HOOK_URL (secret) — full deploy-hook URL
#   RENDER_APP_URL         (var)    — public URL of the Render service
#
#   ── Backend / Frontend (placeholders) ──
#   BACKEND_URL  (var) — production backend URL (for env link)
#   FRONTEND_URL (var) — production frontend URL (for env link)
#
#   ── Observability / notifications ──
#   SLACK_WEBHOOK_URL (secret, optional) — Slack Incoming Webhook for #deploys
#
#   ── Image verification ──
#   COSIGN_IDENTITY_REGEX (var, optional) — defaults to this repo's CI workflow.
#                                            Override for forks / mirrors.
#
# Environment protection rules (configure in Settings → Environments):
#   - production : required reviewers (≥1), 5-min wait timer, deploy
#                   branch = main only.
#   - staging    : no reviewers, deploy from any branch.
#
# Deploy-freeze: create a file `.github/DEPLOY_FREEZE` on `main` to halt
# all deploys until the file is removed. The gate job reads it.
#
# ══════════════════════════════════════════════════════════════════════════════

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker image tag to deploy (default: sha-<git>)"
        required: false
        default: ""
      run_migrations:
        description: "Run Alembic migrations before deploy"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      deploy_render:
        description: "Also deploy to Render (backup target)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      skip_image_verify:
        description: "EMERGENCY ONLY — skip cosign signature verification"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

# Default token has read access only; jobs upgrade what they need.
permissions:
  contents: read

# Never cancel an in-flight production deploy — partial deploys are
# worse than queued ones.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # 1. Gate: CI green + deploy not frozen
  # ──────────────────────────────────────────────────────────────────────────
  gate:
    name: Deploy Gate (CI + Freeze Check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      image_ref: ${{ steps.resolve.outputs.image_ref }}
      previous_sha: ${{ steps.previous.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50  # need history for "previous deploy SHA" lookup

      - name: Block if deploy freeze active
        # Empty file at .github/DEPLOY_FREEZE halts all deploys; the
        # contents (if any) are surfaced as the failure reason so SRE
        # can drop a one-liner explaining why the freeze is on.
        run: |
          if [ -f .github/DEPLOY_FREEZE ]; then
            REASON="$(cat .github/DEPLOY_FREEZE 2>/dev/null || echo 'no reason given')"
            echo "::error::Deploy freeze ACTIVE: $REASON"
            echo "To lift: delete .github/DEPLOY_FREEZE on main."
            exit 1
          fi
          echo "No deploy freeze in effect."

      - name: Resolve image tag and ref
        id: resolve
        # Inputs go through env vars, never expanded directly into the
        # shell command — defeats the script-injection class of finding
        # (Semgrep yaml.github-actions.security.run-shell-injection).
        env:
          INPUT_IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          if [ -n "$INPUT_IMAGE_TAG" ]; then
            TAG="$INPUT_IMAGE_TAG"
          else
            TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          fi
          REF="${REGISTRY}/${IMAGE_NAME}:${TAG}"
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"
          echo "Will deploy: $REF"

      - name: Find previous successful deploy SHA (rollback target)
        id: previous
        # Reads the most recent successful 'production' deployment from
        # the GitHub Deployments API. Falls back to HEAD~1 if none.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV=$(gh api "repos/${{ github.repository }}/deployments?environment=production&per_page=10" \
                 --jq '.[] | select(.sha != "${{ github.sha }}") | .sha' | head -1 || echo "")
          if [ -z "$PREV" ]; then
            PREV=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          echo "sha=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Rollback target if smoke fails: $PREV"

  # ──────────────────────────────────────────────────────────────────────────
  # 2. Verify image: cosign signature + SLSA provenance attestation
  # ──────────────────────────────────────────────────────────────────────────
  verify-image:
    name: Verify Image Signature + Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate]
    if: github.event.inputs.skip_image_verify != 'true'
    permissions:
      contents: read
      packages: read
      id-token: write  # cosign keyless verify uses GitHub OIDC
    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Log in to GHCR (read)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify cosign keyless signature
        # Image must have been signed by THIS repo's CI workflow via
        # GitHub OIDC. A signature from a forked or unrelated workflow
        # is rejected. This is the gate that makes signing meaningful.
        env:
          IMAGE: ${{ needs.gate.outputs.image_ref }}
          IDENTITY_REGEX: ${{ vars.COSIGN_IDENTITY_REGEX || format('https://github.com/{0}/.github/workflows/ci.yml.*', github.repository) }}
        run: |
          cosign verify "$IMAGE" \
            --certificate-identity-regexp "$IDENTITY_REGEX" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --output text

      - name: Verify SLSA build provenance attestation
        # `actions/attest-build-provenance@v1` (used in ci.yml) writes
        # attestations as Sigstore Bundle v0.3 — pushed to OCI 1.1
        # referrers when `push-to-registry: true`. `cosign verify-attestation`
        # was built for the legacy `tag.att` artifact convention and
        # silently returns "no matching attestations" against bundle-format
        # attestations even with `--type slsaprovenance1`.
        #
        # `gh attestation verify` is the canonical GitHub tool for this
        # combo: it resolves tag → digest, fetches the Sigstore bundle
        # from GitHub's attestation store (or the OCI 1.1 referrer),
        # validates against the GitHub OIDC issuer, and verifies the
        # SLSA v1 predicate — all in one call.
        env:
          IMAGE: ${{ needs.gate.outputs.image_ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh attestation verify "oci://${IMAGE}" --owner "${OWNER}"
          echo "SLSA provenance verified."

  # ──────────────────────────────────────────────────────────────────────────
  # 3. DB snapshot (placeholder — wire to your DB provider)
  # ──────────────────────────────────────────────────────────────────────────
  snapshot-db:
    name: Pre-deploy DB Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate, verify-image]
    steps:
      - name: Trigger snapshot
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Snapshot creds not set — skipping pre-deploy backup."
            echo "Configure SUPABASE_PROJECT_REF (var) + SUPABASE_ACCESS_TOKEN (secret) to enable."
            exit 0
          fi
          # Replace with your provider's snapshot API. Example for Supabase:
          # curl -fsS -X POST \
          #   "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/backups" \
          #   -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"
          echo "Snapshot trigger placeholder — wire to provider API."

  # ──────────────────────────────────────────────────────────────────────────
  # 4. Migrate (real, observable, separate from app boot)
  # ──────────────────────────────────────────────────────────────────────────
  # Today migrations run at app startup (database.py:_run_alembic_migrations)
  # because Supabase Nano free tier is IPv6-only. Once on a paid tier
  # with IPv4 reachable from GH runners, switch to migrate.yml as the
  # source of truth and have this job invoke that workflow.
  migrate:
    name: Run Migrations (boot-time stub)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gate, verify-image]
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.run_migrations == 'true'
    environment: production
    steps:
      - name: Migration policy
        run: |
          echo "Migrations execute at app startup (database.py)."
          echo "For explicit pre-deploy migration runs, trigger migrate.yml."

  # ──────────────────────────────────────────────────────────────────────────
  # 5a. Deploy → HF Spaces (primary)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-hf-spaces:
    name: Deploy → HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, verify-image, snapshot-db]
    permissions:
      contents: read
    environment:
      name: production
      url: https://huggingface.co/spaces/${{ vars.HF_SPACE_NAME }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for the HF push

      - name: Verify Dockerfile present
        run: |
          if [ ! -f Dockerfile ]; then
            echo "::error::Root Dockerfile not found — HF Spaces needs it."
            exit 1
          fi

      - name: Configure HF git credentials (token via helper, not URL)
        # Embedding the token in a URL ("https://USER:TOKEN@host") is
        # the legacy pattern — it leaks in any verbose log line. Using
        # a credential helper keeps the token out of git's process args
        # and out of remote URL config.
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN not set."
            exit 1
          fi
          git config --global credential.helper store
          printf 'https://HF_USER:%s@huggingface.co\n' "$HF_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Push to HF Spaces (force-with-lease, not force)
        env:
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        # --force-with-lease refuses the push if the remote moved out
        # from under us (someone else deployed) — preserves the
        # rollback target instead of silently overwriting it.
        run: |
          if [ -z "$HF_SPACE_NAME" ]; then
            echo "::error::HF_SPACE_NAME not set."
            exit 1
          fi
          git remote add hf "https://huggingface.co/spaces/${HF_SPACE_NAME}" 2>/dev/null || \
            git remote set-url hf "https://huggingface.co/spaces/${HF_SPACE_NAME}"
          git fetch hf main || true
          git push --force-with-lease hf HEAD:main
          echo "Pushed to https://huggingface.co/spaces/${HF_SPACE_NAME}"

      - name: Wipe credentials
        if: always()
        run: rm -f ~/.git-credentials

  # ──────────────────────────────────────────────────────────────────────────
  # 5b. Deploy → Render (optional backup)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-render:
    name: Deploy → Render
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, verify-image]
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_render == 'true'
    environment:
      name: production-render
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL not set."
            exit 1
          fi
          HTTP_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL")
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Render hook returned HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Render deploy hook accepted (HTTP $HTTP_CODE)"

  # ──────────────────────────────────────────────────────────────────────────
  # 6. Smoke test — HF Spaces (poll, then fail hard)
  # ──────────────────────────────────────────────────────────────────────────
  smoke-test-hf:
    name: Smoke Test — HF Spaces
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [deploy-hf-spaces]
    outputs:
      result: ${{ steps.smoke.outputs.result }}
    steps:
      - name: Poll for readiness then assert endpoints
        id: smoke
        env:
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          if [ -z "$HF_SPACE_NAME" ]; then
            echo "::error::HF_SPACE_NAME not set."
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          HF_URL="https://$(echo "$HF_SPACE_NAME" | tr '/' '-').hf.space"
          echo "Target: $HF_URL"

          # Poll up to 8 minutes for the container to come live. HF
          # Spaces cold-builds can legitimately take 4-7 min; sleep 60
          # gives a false negative on a real-but-slow deploy.
          READY=0
          for i in $(seq 1 48); do
            CODE=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 10 \
              "${HF_URL}/api/v1/health" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Ready after ${i}×10s polls."
              READY=1
              break
            fi
            echo "  poll ${i}: HTTP $CODE — waiting..."
            sleep 10
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::App did not become ready within 8 minutes."
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Hard-fail smoke. Anything other than expected response is a
          # rollback trigger — no `::warning::` softening.
          assert() {
            local NAME="$1"; local METHOD="$2"; local PATH_URL="$3"; shift 3
            local EXPECTED="$*"
            local CODE
            CODE=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 15 -X "$METHOD" \
              "${HF_URL}${PATH_URL}" || echo "000")
            for E in $EXPECTED; do
              if [ "$CODE" = "$E" ]; then
                echo "OK   $NAME -> $CODE"
                return 0
              fi
            done
            echo "::error::FAIL $NAME -> $CODE (expected one of: $EXPECTED)"
            return 1
          }

          FAILED=0
          assert "health"     GET /api/v1/health        200       || FAILED=$((FAILED+1))
          assert "auth-me"    GET /api/v1/auth/me       401 403   || FAILED=$((FAILED+1))
          assert "decisions"  GET /api/v1/decisions     401 403   || FAILED=$((FAILED+1))
          assert "metrics"    GET /metrics              200       || FAILED=$((FAILED+1))

          if [ "$FAILED" -gt 0 ]; then
            echo "result=fail" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "result=pass" >> "$GITHUB_OUTPUT"

  # ──────────────────────────────────────────────────────────────────────────
  # 7. Auto-rollback on smoke failure
  # ──────────────────────────────────────────────────────────────────────────
  rollback:
    name: Auto-Rollback to Previous SHA
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate, deploy-hf-spaces, smoke-test-hf]
    # Trigger when the deploy succeeded but smoke failed. If the deploy
    # itself failed, nothing was rolled forward, so nothing to revert.
    if: >
      always() &&
      needs.deploy-hf-spaces.result == 'success' &&
      needs.smoke-test-hf.result == 'failure' &&
      needs.gate.outputs.previous_sha != ''
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.previous_sha }}
          fetch-depth: 0

      - name: Configure HF git credentials
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global credential.helper store
          printf 'https://HF_USER:%s@huggingface.co\n' "$HF_TOKEN" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Force previous SHA back to HF Spaces main
        env:
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          git remote add hf "https://huggingface.co/spaces/${HF_SPACE_NAME}" 2>/dev/null || \
            git remote set-url hf "https://huggingface.co/spaces/${HF_SPACE_NAME}"
          git push --force hf HEAD:main
          echo "::warning::Rolled HF Spaces back to ${{ needs.gate.outputs.previous_sha }}"

      - name: Wipe credentials
        if: always()
        run: rm -f ~/.git-credentials

  # ──────────────────────────────────────────────────────────────────────────
  # 8. Record + notify
  # ──────────────────────────────────────────────────────────────────────────
  record-deployment:
    name: Record Deployment + Emit DORA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate, smoke-test-hf]
    if: always() && needs.gate.result == 'success'
    permissions:
      deployments: write
      contents: read
    steps:
      - name: Create GitHub Deployment record
        # Surfaces in the repo's "Environments" tab and links the deploy
        # to the PR/commit. Required for any audit trail review.
        #
        # Build the request body via `jq -n` and pipe to `gh api --input -`.
        # Doing it this way is the only reliable way to send a JSON
        # array (`required_contexts: []`) — `gh api -F` would send the
        # literal string "[]" which the GH API rejects with HTTP 422.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ needs.smoke-test-hf.result == 'success' && 'success' || 'failure' }}
          SHA: ${{ needs.gate.outputs.sha }}
          TAG: ${{ needs.gate.outputs.image_tag }}
          REPO: ${{ github.repository }}
          HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}
        run: |
          DEP_ID=$(jq -n --arg ref "$SHA" \
                          --arg env "production" \
                          --arg desc "Auto-deploy from CI" \
              '{ref: $ref, environment: $env, description: $desc, auto_merge: false, required_contexts: []}' \
            | gh api -X POST "repos/${REPO}/deployments" --input - --jq '.id')
          jq -n --arg state "$STATE" \
                --arg url "https://huggingface.co/spaces/${HF_SPACE_NAME}" \
                --arg desc "Deploy ${TAG}" \
              '{state: $state, environment_url: $url, description: $desc}' \
            | gh api -X POST "repos/${REPO}/deployments/${DEP_ID}/statuses" \
              --input - >/dev/null
          echo "Recorded deployment $DEP_ID (state=$STATE)"

      - name: Notify Slack
        # Graceful no-op if SLACK_WEBHOOK_URL absent — keeps this safe
        # to copy into other repos.
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          STATE: ${{ needs.smoke-test-hf.result }}
          SHA: ${{ needs.gate.outputs.sha }}
          TAG: ${{ needs.gate.outputs.image_tag }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not set — skipping notification."
            exit 0
          fi
          if [ "$STATE" = "success" ]; then
            EMOJI=":rocket:"; COLOR="good"; HEADLINE="Deploy succeeded"
          else
            EMOJI=":rotating_light:"; COLOR="danger"; HEADLINE="Deploy FAILED — auto-rollback fired"
          fi
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "$(jq -n --arg e "$EMOJI" --arg h "$HEADLINE" --arg t "$TAG" \
                       --arg s "$SHA" --arg a "$ACTOR" --arg u "$RUN_URL" --arg c "$COLOR" \
                  '{attachments:[{color:$c, text:"\($e) \($h): tag=`\($t)` sha=`\($s)` by \($a) <\($u)|run>"}]}')" \
            "$SLACK_WEBHOOK_URL"

      - name: Emit DORA metric (deployment frequency)
        # Structured log line the SRE platform can scrape. Replace with
        # a Datadog/Honeycomb push when a metrics pipeline is wired.
        env:
          STATE: ${{ needs.smoke-test-hf.result }}
        run: |
          jq -n \
            --arg event "deployment" \
            --arg env "production" \
            --arg sha "${{ needs.gate.outputs.sha }}" \
            --arg tag "${{ needs.gate.outputs.image_tag }}" \
            --arg state "$STATE" \
            --arg actor "${{ github.actor }}" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{event:$event, env:$env, sha:$sha, tag:$tag, state:$state, actor:$actor, ts:$ts}'

  # ──────────────────────────────────────────────────────────────────────────
  # Optional: backend / frontend deploy placeholders (kept from original)
  # ──────────────────────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, verify-image]
    if: false  # disabled until SSH/Railway/Fly target is wired
    environment:
      name: production
      url: ${{ vars.BACKEND_URL }}
    steps:
      - name: Placeholder
        run: |
          echo "Wire SSH/Railway/Fly here. Image: ${{ needs.gate.outputs.image_ref }}"

  deploy-frontend:
    name: Deploy Frontend (placeholder)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [gate]
    if: false  # disabled until Vercel/Netlify target is wired
    environment:
      name: production
      url: ${{ vars.FRONTEND_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.BACKEND_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.CB_GOOGLE_CLIENT_ID }}
      - run: echo "Wire Vercel/Netlify here."
