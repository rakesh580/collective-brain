[project]
name = "collective-brain"
version = "0.1.0"
description = "AI-powered shared memory and strategy brain for small groups"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
]
ignore = [
    "S101",  # assert used in tests
    "S104",  # binding to 0.0.0.0
    "S603",  # subprocess calls (needed for git)
    "S607",  # partial path for subprocess
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"alembic/**" = ["F401"]
