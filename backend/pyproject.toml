[project]
name = "collective-brain"
version = "0.1.0"
description = "AI-powered shared memory and strategy brain for small groups"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Exclude locust load tests from default pytest runs (locust monkey-patches
# gevent/ssl which conflicts with Python 3.11+).  Run load tests directly
# via: locust -f tests/load_test.py

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "S",     # flake8-bandit (security)
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
]
ignore = [
    "S101",  # assert used in tests
    "S104",  # binding to 0.0.0.0
    "S603",  # subprocess calls (needed for git)
    "S607",  # partial path for subprocess
    "E501",  # line too long (handled by formatter)
    "B008",  # function call in default arg (FastAPI Depends pattern)
    "B904",  # raise from within except (too noisy for this codebase)
    "B905",  # zip strict (Python 3.10+, not always needed)
    "S110",  # try-except-pass (used for optional imports)
    "S311",  # random (not for crypto, used for jitter/colors)
    "S605",  # os.system (not used in production code)
    "S608",  # SQL injection (SQLAlchemy ORM is safe)
    "E402",  # module-level import not at top (FastAPI pattern)
    "SIM102", # nested if (more readable than combined in some cases)
    "SIM105", # contextlib.suppress (try-except-pass is clearer for comments)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "T201", "B007", "F841"]
"alembic/**" = ["F401"]
